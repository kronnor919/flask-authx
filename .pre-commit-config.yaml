exclude: '^docs/|/migrations/|node_modules/|\.tox/|\.venv/|build/|dist/'
default_language_version:
  python: python3.13
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      
      - id: ruff-format
        types_or: [python, pyi]

      - id: ruff-check
        types_or: [python, pyi]
  
  - repo: local
    hooks:
      - id: pytest
        name: pytest-all
        entry: .venv/bin/python -m pytest tests/ -xvs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        types: [python]
