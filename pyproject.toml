[project]
name = "Flask-AuthX"
version = "0.1.0"
description = "Launch at 'MVP' speed. Built to outgrow 'MVP'."
readme = "README.md"
authors = [
    { name = "kronnor919", email = "segundacuenta7364@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.2",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pydantic-settings>=2.11.0",
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
