[project]
name = "Flask-AuthX-Extension"
version = "0.1.0"
description = "Launch at 'MVP' speed. Built to outgrow 'MVP'."
readme = "README.md"
authors = [
    { name = "kronnor919", email = "segundacuenta7364@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.2",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "pre-commit>=4.5.1",
    "pydantic-settings>=2.11.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/flask_authx"]
